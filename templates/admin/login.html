{% extends "admin/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="form-panel admin-narrow">
<h1 class="admin-h1">Insights admin</h1>
<p class="helper">Enter the admin password to add or edit Insights articles.</p>
{% if error %}<p class="validation" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('insights.admin_login') }}" autocomplete="off">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="password">Password</label>
<input class="admin-input" id="password" name="password" type="password" required autofocus autocomplete="current-password">
<button class="cta" type="submit">Log in</button>
</form>
</section>
{% endblock %}
